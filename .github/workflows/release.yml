name: Generate WordPress Plugin Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Haalt het versienummer rechtstreeks uit je hoofd-PHP-bestand
      - name: Extract WordPress Plugin Version
        id: get_version
        run: |
          # BELANGRIJK: Vervang 'plugin-naam.php' door jouw echte PHP-bestandsnaam!
          VERSION=$(grep -i "Version:" plugin-naam.php | head -n 1 | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r ')
          echo "PLUGIN_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Gevonden versie: $VERSION"

      # Maakt direct een schone zip van de plugin
      - name: Create WordPress Plugin ZIP
        shell: bash
        run: |
          ZIP_NAME="${{ github.event.repository.name }}.zip"
          rm -f "$ZIP_NAME"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.zip" \
            -x "node_modules/*"
          ls -lh "$ZIP_NAME"

      # Maakt de release aan en uploadt de ZIP
      - name: Create and Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: '${{ github.event.repository.name }}.zip'
          tag_name: 'v${{ steps.get_version.outputs.version }}'
          name: 'Release v${{ steps.get_version.outputs.version }}'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
